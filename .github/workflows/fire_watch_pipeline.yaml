name: Tunisia Fire Watch - Automated Pipeline

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    # TRÈS IMPORTANT : On déclare ici le Secret pour qu'il soit accessible comme variable d'environnement
    env:
      SUPABASE_DB_URI: ${{ secrets.SUPABASE_DB_URI }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system geospatial dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas geopandas shapely requests pystac-client planetary-computer odc-stac xgboost scikit-learn joblib sqlalchemy psycopg2-binary geoalchemy2 python-dotenv rioxarray

      # Si le modèle n'est pas versionné sur le repo, on le génère à la volée avant de lancer la prédiction
      - name: Ensure Model Exists
        run: |
          python Train_XGBoost_Fire_Model.py || echo "Modèle déjà présent ou entraînement ignoré"

      - name: Run Data Collection & Prediction Pipeline
        run: |
          python Run_Automation_Pipeline.py