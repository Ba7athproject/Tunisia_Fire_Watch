name: Tunisia Fire Watch - Automated Pipeline

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_DB_URI: ${{ secrets.SUPABASE_DB_URI }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system geospatial dependencies (GDAL/GEOS)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas geopandas shapely requests pystac-client planetary-computer odc-stac xgboost scikit-learn joblib sqlalchemy psycopg2-binary geoalchemy2 python-dotenv rioxarray

      - name: Run Data Collection & Prediction Pipeline
        run: |
          # 1. Collecte automatisée des anomalies thermiques actives (FIRMS) et données météo
          python Run_Automation_Pipeline.py
          
          # 2. Inférence du modèle XGBoost et export CSV des zones en alerte
          python vegetation_modele_reel.py

      - name: Commit et Push de la carte prédictive allégée
        run: |
          # Configuration de l'identité du bot pour maintenir la transparence des logs
          git config --global user.name "Pipeline ba7ath"
          git config --global user.email "bot@ba7ath.org"
          
          # Indexation exclusive de la matrice de risques allégée
          git add carte_risques_demain_reel.csv
          
          # Validation silencieuse (évite que le pipeline plante si aucun changement n'est détecté)
          git commit -m "🤖 Mise à jour automatique de la matrice de risque (XGBoost)" || echo "Aucune modification de la carte détectée"
          
          # Envoi des données vers le dépôt pour déclencher l'actualisation de l'interface Streamlit
          git push