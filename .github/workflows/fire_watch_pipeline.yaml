name: Tunisia Fire Watch - Automated Pipeline

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    env:
      SUPABASE_DB_URI: ${{ secrets.SUPABASE_DB_URI }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system geospatial dependencies (GDAL/GEOS)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin libgeos-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas geopandas shapely requests pystac-client planetary-computer odc-stac xgboost scikit-learn joblib sqlalchemy psycopg2-binary geoalchemy2 python-dotenv rioxarray

      - name: Run Data Collection & Prediction Pipeline
        run: |
          # 1. Collecte automatisée des anomalies thermiques actives (FIRMS) et données météo
          python Run_Automation_Pipeline.py
          
          # 1.5 Génération de la grille météorologique prévisionnelle nationale (Open-Meteo)
          python OpenMeteo_Grid_Forecast.py
          
          # 2. Téléchargement et calcul de la biomasse géobotanique (NDVI/NDWI via MODIS)
          python telecharger_biomasse_actuelle.py
          
          # 3. Inférence du modèle XGBoost et export CSV des zones en alerte
          python vegetation_modele_reel.py

      - name: Commit et Push des résultats OSINT
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          git add carte_risques_demain_reel.csv
          
          # Le commit ne fait pas échouer l'action s'il n'y a rien à commiter
          git commit -m "🤖 Mise à jour de la matrice de risque (Anti-mer activé)" || echo "Aucune modification détectée"
          
          # Désactivation du rebase (incompatible avec les clones partiels)
          git config pull.rebase false
          
          # Récupération des changements distants en donnant priorité absolue au fichier local (-X ours)
          git pull origin main -s recursive -X ours --allow-unrelated-histories || true
          
          # Poussée finale
          git push origin main